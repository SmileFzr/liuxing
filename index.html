<style>
:root{color-scheme:dark;--glass:rgba(11,18,29,.78);--edge:rgba(220,232,246,.25)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172431;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}

.panel{background:var(--glass);border:1px solid var(--edge);border-radius:13px;backdrop-filter:blur(8px);box-shadow:0 8px 28px #0002}
.brand{padding:10px 13px}.brand strong{display:block;letter-spacing:.12em;font-size:16px}.brand small{color:#bac8d7;font-size:10px}
.stats{padding:9px 11px;width:min(320px,58vw)}.barrow{display:grid;grid-template-columns:35px 1fr 28px;align-items:center;gap:6px;margin:4px 0;font-size:11px}

#php{background:linear-gradient(90deg,#c63f51,#ff8585)}#psp{background:linear-gradient(90deg,#347ac7,#81d9ff)}#ehp{background:linear-gradient(90deg,#a77b38,#f8d887)}

#message.show{opacity:1}.hint{position:absolute;left:10px;bottom:10px;padding:9px 11px;font-size:11px;line-height:1.6;color:#d7e1ed;max-width:280px}

.actions{position:absolute;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,60px);gap:6px;pointer-events:auto}
.touchbtn{min-height:46px;border:1px solid #ffffff4a;border-radius:12px;background:#101a2bd9;font-size:12px;font-weight:750;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 3px 10px #0003}
.touchbtn:active,.touchbtn.active{background:#466b8f;transform:scale(.96)}.empty{visibility:hidden}

</style>
</head>

const ring=new THREE.Mesh(new THREE.RingGeometry(3.7,3.78,64),new THREE.MeshBasicMaterial({color:0xd7bd85,side:THREE.DoubleSide,transparent:true,opacity:.7}));ring.rotation.x=-Math.PI/2;ring.position.y=.07;scene.add(ring);

const player=fighter({robe:0x294e70,accent:0xd5b46e,x:0,z:3});

const keys=new Set();let hp=100,stamina=100,ehp=100,pState='idle',eState='idle',pTimer=0,eTimer=0,pCD=0,eCD=0,dodgeCD=0,block=false,over=false,pHit=false,eHit=false,flashP=0,flashE=0,msgTime=0,wins=Number(localStorage.getItem('ljy_wins')||0);

function reset(){hp=stamina=ehp=100;player.root.position.set(0,0,3);enemy.root.position.set(0,0,-3);player.root.rotation.y=Math.PI;enemy.root.rotation.y=0;pState=eState='idle';pTimer=eTimer=pCD=eCD=dodgeCD=0;over=false;block=false;say('刀光一闪，开始交手！',1.3);hud()}

function attack(heavy){if(over||pCD>0||!['idle','move','block'].includes(pState))return;const cost=heavy?30:15;if(stamina<cost){say('体力不足',.6);return}stamina-=cost;pState=heavy?'heavy':'light';pTimer=heavy?.62:.42;pCD=heavy?.9:.56;pHit=false;say(heavy?'重斩！':'轻击！',.38)}

window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.repeat||over)return;if(e.code==='KeyJ')attack(false);if(e.code==='KeyK')attack(true);if(e.code==='Space')dodge();if(e.code==='KeyL')block=true});

// Sword-swing streaks: short-lived translucent arc segments.
const fxGroup=new THREE.Group();scene.add(fxGroup);let fx=[];
function slashFX(f){const points=[];for(let i=0;i<=18;i++){const a=-1.15+i/18*2.3;points.push(new THREE.Vector3(Math.sin(a)*1.15,1.45+Math.cos(a)*.28,.55+Math.cos(a)*.8))}const geo=new THREE.BufferGeometry().setFromPoints(points);const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xc7ecff,transparent:true,opacity:.9}));line.position.copy(f.root.position);line.rotation.y=f.root.rotation.y;fxGroup.add(line);fx.push({line,life:.18})}
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;
 if(msgTime>0){msgTime-=dt;if(msgTime<=0)$('message').classList.remove('show')}
 pCD=Math.max(0,pCD-dt);eCD=Math.max(0,eCD-dt);dodgeCD=Math.max(0,dodgeCD-dt);stamina=Math.min(100,stamina+(block?3:12)*dt);

  if(['idle','move','block'].includes(pState)){if(block&&stamina>0)pState='block';else if(mv.lengthSq())pState='move';else pState='idle';if(pState==='move'){p.addScaledVector(mv,4*dt);player.root.rotation.y=Math.atan2(mv.x,mv.z)}else if(dist(p,e)<5)face(player.root,enemy.root);p.x=clamp(p.x,-10,10);p.z=clamp(p.z,-10,10)}
  if(pState==='light'||pState==='heavy'){pTimer-=dt;face(player.root,enemy.root);const total=pState==='heavy'?.62:.42,elapsed=total-pTimer;player.sword.rotation.x=-Math.sin(Math.min(1,elapsed/total)*Math.PI)*1.65;const active=pState==='heavy'?(elapsed>.2&&elapsed<.44):(elapsed>.11&&elapsed<.3);if(active&&!pHit&&dist(p,e)<(pState==='heavy'?2.35:1.9)){pHit=true;damageEnemy(pState==='heavy'?25:13);slashFX(player)}if(pTimer<=0){pState='idle';player.sword.rotation.x=0}}
  if(pState==='dodge'||pState==='hurt'){pTimer-=dt;if(pTimer<=0)pState='idle'}if(pState==='block')player.sword.rotation.x=-.5;else if(['idle','move'].includes(pState))player.sword.rotation.x=0;
  const d=dist(e,p);
  if(['idle','move'].includes(eState)){if(d>1.7){eState='move';face(enemy.root,player.root);e.addScaledVector(p.clone().sub(e).setY(0).normalize(),1.55*dt)}else{eState='idle';face(enemy.root,player.root);if(eCD<=0){eState='attack';eTimer=.72;eCD=1.35;eHit=false;say('对手准备出招！',.45)}}}
  else if(eState==='attack'){eTimer-=dt;face(enemy.root,player.root);enemy.sword.rotation.x=-Math.sin((.72-eTimer)/.72*Math.PI)*1.45;if(eTimer<.36&&eTimer>.2&&!eHit&&dist(e,p)<2){eHit=true;damagePlayer(12);slashFX(enemy)}if(eTimer<=0){eState='idle';enemy.sword.rotation.x=0}}
  else if(eState==='hurt'){eTimer-=dt;if(eTimer<=0)eState='idle'}

  if(flashE>0){flashE-=dt;enemy.torso.material.emissive.setHex(0xff8c30)}else enemy.torso.material.emissive.setHex(0x000000);
  player.torso.position.y=1.25+(pState==='move'?Math.abs(Math.sin(t*10))*.08:Math.sin(t*2)*.012);enemy.torso.position.y=1.25+(eState==='move'?Math.abs(Math.sin(t*7))*.06:Math.sin(t*2.2)*.012);
  player.armR.rotation.x=pState==='block'?-0.85:Math.sin(t*5)*.02;enemy.armR.rotation.x=eState==='attack'?-0.5:0;hud();

 const target=new THREE.Vector3(player.root.position.x,1.15,player.root.position.z),off=new THREE.Vector3(Math.sin(yaw)*7.7,4.6,Math.cos(yaw)*7.7);
