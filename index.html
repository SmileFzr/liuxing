<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>无尽回响：轮回</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ 主菜单 ============ -->
<div class="screen" id="menu">
  <h1>无尽回响</h1>
  <div class="sub">轮 回</div>
  <button class="btn primary" id="btnNewGame">🎮 开 始 游 戏</button>
  <button class="btn" id="btnContinue">📖 继 续 游 戏</button>
  <button class="btn" id="btnCodexMonster">📚 怪 物 图 鉴</button>
  <button class="btn" id="btnCodexPet">🐾 宠 物 图 鉴</button>
  <button class="btn warn" id="btnReincarnate" style="margin-top:20px">🔄 轮 回（需先击杀最终 BOSS）</button>
  <div class="versionTag">v0.3.0 · 轮回<br><span style="opacity:.55;font-size:10px">12生肖 · 悬赏 · 图鉴 · 轮回</span></div>
</div>

<!-- ============ 探索 ============ -->
<div class="screen hidden" id="explore">
  <div id="mapWorld">
    <div id="mapBg"></div>
    <div id="mapGround"></div>
    <div id="mapTexture"></div>
    <div id="mapDecor"></div>
  </div>
  <div id="party"></div>
  <div id="minimap" class="hidden"></div>
  <div id="interactBtn" class="hidden"></div>
  <div id="exploreUI">
    <div id="topBar">
      <div>
        <div id="locName">沙丘镇</div>
        <div style="font-size:11px;opacity:.6;margin-top:2px" id="locSub">起点</div>
      </div>
      <div id="partyStats"></div>
    </div>
    <div id="joyZone">
      <div id="joyBase"></div>
      <div id="joyKnob"></div>
    </div>
    <div id="rightBtns">
      <div class="circleBtn" id="btnAuto" title="自动探索">🚶</div>
      <div class="circleBtn" id="btnBag" title="背包">🎒</div>
      <div class="circleBtn" id="btnTeam" title="队伍">👥</div>
      <div class="circleBtn" id="btnTown" title="城镇">🏠</div>
    </div>
  </div>
  <div id="hintBar" class="hidden"></div>
</div>

<!-- ============ 战斗 ============ -->
<div class="screen hidden" id="battle">
  <div id="battleField">
    <div id="enemyRow"></div>
    <div id="battleLogArea"><div id="battleLogList"></div></div>
    <div id="playerRow"></div>
    <div id="battleTimer" class="hidden">
      <div class="num">18</div>
      <div class="lbl">选择行动</div>
    </div>
  </div>
  <div id="battleUI">
    <div id="battleMsg">等待行动...</div>
    <div id="actionBar">
      <button class="actionBtn" data-act="attack"><span class="icon">⚔️</span>攻击</button>
      <button class="actionBtn" data-act="skill"><span class="icon">✨</span>技能</button>
      <button class="actionBtn" data-act="item"><span class="icon">🎒</span>道具</button>
      <button class="actionBtn" data-act="defend"><span class="icon">🛡️</span>防御</button>
      <button class="actionBtn capture" data-act="capture"><span class="icon">🔮</span>捕捉</button>
      <button class="actionBtn escape" data-act="escape"><span class="icon">🏃</span>逃跑</button>
      <button class="actionBtn" data-act="auto"><span class="icon">🤖</span>自动</button>
    </div>
  </div>
  <div id="battleLog"></div>
  <div id="subMenu" class="hidden">
    <div id="subTitle">选择</div>
    <div id="subList"></div>
    <button id="subBack">返 回</button>
  </div>
</div>

<!-- ============ 加点面板 ============ -->
<div class="overlay hidden" id="statPanel">
  <div class="panel">
    <div class="panelTitle" id="statWho">角色名</div>
    <div class="panelSub" id="statSub">Lv.1</div>
    <div class="pointLeft">剩余点数：<b id="ptLeft">0</b></div>
    <div id="statGrid"></div>
    <div class="sectionTitle">技 能</div>
    <div id="skillList"></div>
    <button class="btn primary" id="statClose" style="width:100%;margin-top:14px">确 定</button>
  </div>
</div>

<!-- ============ 背包 ============ -->
<div class="overlay hidden" id="bagPanel">
  <div class="panel">
    <div class="panelTitle">🎒 背包</div>
    <div class="panelSub">金币 <span id="bagGold">0</span></div>
    <div id="bagList"></div>
    <button class="btn primary" id="bagClose" style="width:100%;margin-top:14px">关 闭</button>
  </div>
</div>

<!-- ============ 队伍面板 ============ -->
<div class="overlay hidden" id="teamPanel">
  <div class="panel">
    <div class="panelTitle">👥 队伍</div>
    <div class="panelSub">3 角色 + 最多 3 宠物出战</div>
    <div id="teamList"></div>
    <div id="petList"></div>
    <button class="btn primary" id="teamClose" style="width:100%;margin-top:14px">关 闭</button>
  </div>
</div>

<!-- ============ 图鉴 ============ -->
<div class="overlay hidden" id="codexPanel">
  <div class="panel">
    <div class="panelTitle" id="codexTitle">图 鉴</div>
    <div class="panelSub" id="codexSub">已收集</div>
    <div id="codexGrid" class="codexGrid"></div>
    <button class="btn primary" id="codexClose" style="width:100%;margin-top:14px">关 闭</button>
  </div>
</div>

<!-- ============ 通用面板（商店 / 药师 / 神秘人） ============ -->
<div class="overlay hidden" id="dynPanel">
  <div class="panel">
    <div class="panelTitle" id="dynTitle">面 板</div>
    <div class="panelSub" id="dynSub"></div>
    <div id="dynBody"></div>
    <button class="btn primary" id="dynClose" style="width:100%;margin-top:14px">关 闭</button>
  </div>
</div>

<!-- ============ 战斗结算 ============ -->
<div class="overlay hidden" id="resultPanel">
  <div class="panel">
    <div class="panelTitle" id="resultTitle">战斗结算</div>
    <div class="panelSub">战 报</div>
    <div id="resultBody"></div>
    <button class="btn primary" id="resultClose" style="width:100%;margin-top:14px">继 续</button>
  </div>
</div>

<!-- ============ 对话框 ============ -->
<div class="hidden" id="dialog">
  <div id="dlgHeader">
    <div id="dlgAvatar">👤</div>
    <div id="dlgName"></div>
  </div>
  <div id="dlgText"></div>
  <div id="dlgOptions"></div>
</div>

<div id="toast"></div>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/battle.js"></script>
<script src="js/explore.js"></script>
<script src="js/ui.js"></script>
<script src="js/ui-panels.js"></script>
<script src="js/main.js"></script>
</body>
</html>
